<!DOCTYPE html>

<script src="leaflet.js"> // insertion bibliothèque Leaflet : http://leafletjs.com/ </script>

<title>TER</title>
<link rel="stylesheet" type="text/css" href="leaflet.css" /> 
<link rel="stylesheet" type="text/css" href="style-ter.css"/>

<meta charset="utf-8">

<h1>Régularité des TER</h1>

<div id="map"></div>  

<div id="reponse">
     <p></p>
     <img alt="" src="" />
</div>


<script>
// Creation d'une carte dans la balise div "map", et positionne la vue sur un point donné et un niveau de zoom
var map = L.map('map').setView([46.5,2.5], 5);
// Ajout d'une couche de dalles OpenStreetMap
L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {
     attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors'
     }).addTo(map);

// Récupération des données des régions à la fin du chargement de la page
window.addEventListener('load', load_data);
	 
function load_data () {
    var xhr = new XMLHttpRequest();
    // Traitement de la réponse (fonction callback)
	xhr.onload = function() {
	  if (this.status != 200) {  // test erreur 
	    image.src = "";
	    image.alt = "";
	    legende.innerHTML = "Erreur. code = " + this.status;
	    return;
	    }
      // récupération des données renvoyées par le serveur
	  var data = JSON.parse(this.responseText);
      // boucle sur les enregistrements renvoyés
      for ( n = 0; n < data.length; n++ ) {
        // insertion d'un marqueur à la position, attachement d'une popup, capture de l'évènement "clic'
	    L.marker([data[n].lat,data[n].lon]).addTo(map)
          .bindPopup(data[n].nom)
		  .addEventListener('click',OnMarkerClick)
		  .idreg=data[n].nom;   // propriété personnalisée ajouté au marqueur
	    }
    };
	// Requête au serveur
    xhr.open('GET','/regions',true);  // on réupère la lsite des régions
    xhr.send();
}

function OnMarkerClick (e) {
    var xhr = new XMLHttpRequest();
	var image =  document.querySelector('#reponse img'),
        legende = document.querySelector('#reponse p');
    // Traitement de la réponse (fonction callback)
	xhr.onload = function() { 
	  if (this.status != 200) {  // test erreur 
	    image.src = "";
        image.alt = "";
        legende.innerHTML = "Erreur. code = " + this.status;
		return;
		}
      var data = JSON.parse(this.responseText)
      image.src = data.img;
      image.alt = data.title;
      legende.innerHTML = data.title;
      };
	// Requête au serveur
    xhr.open('GET','/ponctualite/'+e.target.idreg,true);  // on récupère le titre et l'URL de la courbe
    xhr.send();
}
</script>
