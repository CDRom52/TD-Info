<!DOCTYPE html>
<html>
<head>
    <title>TD3 - S3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <h1>Mon premier formulaire</h1>

    <div class="form-container">
        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" name="Prenom" required>

        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="Nom" required>

        <button id="bouton">Envoyer</button>

        <p id="reponse"></p>
    </div>

    <script>
    document.getElementById('bouton').addEventListener('click', envoiformulaire);
     
    function envoiformulaire(e) {
        var xhr = new XMLHttpRequest(); 
        var pr = document.getElementById('prenom').value;
        var no = document.getElementById('nom').value;
        
        xhr.onload = function() {
            var data = JSON.parse(this.responseText);
            var zoneReponse = document.getElementById('reponse');
            zoneReponse.innerHTML = 'Bonjour ' + data.prenom + ' ' + data.nom;
            zoneReponse.style.display = 'block'; 
        };
        
        xhr.open('GET', '/toctoc?' + 'Prenom=' + pr + '&' + 'Nom=' + no, true);
        xhr.send();
    }
    </script>

</body>
</html>
