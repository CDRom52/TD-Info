<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TD3 - S4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Formulaire Nom et Prénom</h1>

    <div class="form-container">
        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" name="Prenom" required>

        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="Nom" required>

        <button id="bouton">Envoyer</button>

        <p id="reponse"></p>
    </div>

    <script>
    document.getElementById('bouton').addEventListener('click', envoiformulaire);
     
    function envoiformulaire(e) {
        var xhr = new XMLHttpRequest(); 
        
        // Récupération des valeurs saisies
        var pr = document.getElementById('prenom').value;
        var no = document.getElementById('nom').value;
        
        xhr.onload = function() {
            var data = JSON.parse(this.responseText);
            var zoneReponse = document.getElementById('reponse');
            
            // Affichage de la réponse du serveur JSON
            zoneReponse.innerHTML = 'Bonjour ' + data.prenom + ' ' + data.nom;
            zoneReponse.style.display = 'block'; 
        };
        
        // MODIFICATION ICI : On passe les variables directement dans le chemin de l'URL
        // Exemple généré : /toctoc/Jean/Dupont
        xhr.open('GET', '/toctoc/' + encodeURIComponent(pr) + '/' + encodeURIComponent(no), true);
        xhr.send();
    }
    </script>

</body>
</html>
